name: stocks-kr

on:
  schedule:
    # UTC 월~금 07:00 = KST 월~금 16:00. 한국장 15:30 마감 30분 뒤이고, UTC 요일과
    # KST 요일이 같다(미국장 워크플로와 다른 점이다).
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

# 상태 파일을 쓰지 않는다 — 커밋할 것이 없으므로 읽기 권한이면 충분하다.
permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Send KR stock brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 관심 종목은 시크릿이 아니다 — Variables다. 마스킹되지 않아 로그로 확인할 수 있다.
          STOCKS_WATCHLIST_KR: ${{ vars.STOCKS_WATCHLIST_KR }}
        run: python -m secretary.stocks --market kr
